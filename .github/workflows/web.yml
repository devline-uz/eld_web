# OneBook ELD web panel — the `web` CI job (tz.md §2.4, §16, §18; WB-055).
# Gate order: npm ci → typecheck → lint → unit → build (incl. bundle budget) → audit.
# No deploy, no secrets, no E2E against live servers. The backend repo is not checked out here,
# so the Prisma enum cross-check in src/shared/api/cache.test.ts skips itself (WB-056), and
# `test:contract` is not run: it reads ../backend/docs/openapi.json and cannot pass without it.
name: web

on:
  push:
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build (bundle budget, source maps stripped from dist/)
        run: npm run build

      - name: Audit production dependencies (high+ fails)
        run: npm audit --omit=dev --audit-level=high
