# OneBook ELD web panel — security headers for the production nginx site.
# Source: web/tz.md §17 · web/decisions.md WD-058 · verified by web/deploy/verify-csp.sh
#
# Install (the user applies this; agents never edit system nginx):
#   cp web/deploy/nginx-security-headers.conf /etc/nginx/snippets/onebook-eld-security-headers.conf
#   # in /etc/nginx/sites-enabled/eldadmin.stackyard.uz, inside the `listen 443 ssl` server block,
#   # next to `root /var/www/eldadmin.stackyard.uz;`:
#   include /etc/nginx/snippets/onebook-eld-security-headers.conf;
#   nginx -t && systemctl reload nginx
#
# LIVE-013 (QA 2026-10-14): the live site sends none of these headers and still answers with
# `Server: nginx/1.24.0 (Ubuntu)`, so this file is not included there yet. After the include,
# check from outside: `curl -sI https://eldadmin.stackyard.uz/ | grep -iE 'content-security|strict-transport|x-frame|x-content-type|referrer|permissions|^server'`
# — expect all six headers and a bare `Server: nginx` (repeat for /assets/<file>.js and /some/spa/route).
#
# nginx caveat: `add_header` is NOT inherited by a `location` that declares any `add_header` of
# its own. The live site HAS such locations since nginx-perf-20260916.sh (`location /assets/` and
# `location /` both set Cache-Control), so a server-level include alone sends NOTHING on any page.
# Include this file in the server block AND inside every location that has its own add_header —
# deploy/nginx-security-20261015.sh does exactly that. (`set`, `add_header` and `server_tokens` are
# all valid in both server and location context.)
#
# Expected header set after install (curl -sI https://eldadmin.stackyard.uz/):
#   Server: nginx
#   Content-Security-Policy-Report-Only: default-src 'self'; ...   (enforcing later, see below)
#   Strict-Transport-Security: max-age=31536000; includeSubDomains
#   X-Content-Type-Options: nosniff
#   X-Frame-Options: DENY
#   Referrer-Policy: strict-origin-when-cross-origin
#   Permissions-Policy: accelerometer=(), ... microphone=(self), ...
#   Cross-Origin-Opener-Policy: same-origin-allow-popups
#   Cross-Origin-Resource-Policy: same-origin
#
# ── Hosts: edit these lines, not the policy below ─────────────────────────────────────────────
# REST API + Socket.IO (polling transport uses https, websocket transport uses wss).
set $eld_api_origin    "https://eldapi.stackyard.uz";
set $eld_ws_origin     "wss://eldapi.stackyard.uz";
# Map tile provider (web/tz.md §22 Q-2 is still open). Must cover style.json, tiles, glyphs and
# sprites of VITE_MAP_STYLE_URL, plus the VITE_TRAFFIC_TILES_URL host (HERE / TomTom traffic flow).
set $eld_map_hosts     "https://api.maptiler.com https://api.tomtom.com https://traffic.maps.hereapi.com";
# ⚠ PLACEHOLDER — the self-hosted routing server (origin of VITE_ROUTING_URL, e.g.
# "https://osrm.stackyard.uz"). The public router.project-osrm.org demo is no longer used; until this
# is filled the route preview draws straight lines (the browser blocks nothing it does not call).
set $eld_routing_origin "";
# Presigned storage host (S3 / MinIO origin) for DVIR photos, report downloads and voice-message
# audio. Empty = only same-origin; set it to the bucket's public origin when one is used.
set $eld_storage_hosts "";
# Sentry ingest (only contacted when VITE_SENTRY_DSN is set in the build).
set $eld_sentry_hosts  "https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io";
# Firebase Google sign-in (Q-1). The auth iframe lives on VITE_FIREBASE_AUTH_DOMAIN — narrow the
# wildcard to that exact host once the Firebase project exists.
set $eld_firebase_frame "https://eldbook.firebaseapp.com";

# ── Content-Security-Policy ───────────────────────────────────────────────────────────────────
# script-src: no 'unsafe-inline', no 'unsafe-eval'. apis.google.com is Firebase Auth's
#   popup/redirect helper (gapi) — required for Google-only sign-in in production (WD-058).
# style-src 'unsafe-inline': Radix portals inject a <style> element (react-remove-scroll) and
#   MapLibre/Recharts set style attributes; §17 allows it. Styles cannot execute script.
# worker-src/child-src blob:: MapLibre GL spawns its tile workers from a blob: URL.
set $eld_csp "default-src 'self'; ";
set $eld_csp "${eld_csp}script-src 'self' https://apis.google.com; ";
set $eld_csp "${eld_csp}style-src 'self' 'unsafe-inline'; ";
set $eld_csp "${eld_csp}img-src 'self' data: blob: https://*.googleusercontent.com $eld_map_hosts $eld_storage_hosts; ";
set $eld_csp "${eld_csp}font-src 'self' data:; ";
# media-src: W-16 voice messages — a recording is previewed from a blob: URL and played back from a
# presigned storage URL (fill $eld_storage_hosts with the S3/MinIO origin or playback is blocked).
set $eld_csp "${eld_csp}media-src 'self' blob: $eld_storage_hosts; ";
set $eld_csp "${eld_csp}connect-src 'self' $eld_api_origin $eld_ws_origin $eld_map_hosts $eld_routing_origin $eld_storage_hosts $eld_sentry_hosts https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com; ";
set $eld_csp "${eld_csp}worker-src 'self' blob:; ";
set $eld_csp "${eld_csp}child-src 'self' blob:; ";
set $eld_csp "${eld_csp}frame-src $eld_firebase_frame https://accounts.google.com; ";
set $eld_csp "${eld_csp}frame-ancestors 'none'; ";
set $eld_csp "${eld_csp}object-src 'none'; ";
set $eld_csp "${eld_csp}base-uri 'self'; ";
set $eld_csp "${eld_csp}form-action 'self'; ";
set $eld_csp "${eld_csp}manifest-src 'self'; ";
set $eld_csp "${eld_csp}upgrade-insecure-requests";

# LV-04 (QA 2026-10-15): shipped as Report-Only first. The browser evaluates the policy and logs
# every would-be violation to the DevTools console (and fires `securitypolicyviolation`) but blocks
# nothing, so a host missed above cannot break sign-in, the map or Socket.IO in production.
# Note: `frame-ancestors` and `upgrade-insecure-requests` are ignored in Report-Only mode — the
# enforced X-Frame-Options: DENY below covers clickjacking meanwhile.
# After ~1-2 weeks with no violations in the console on every screen (W-00…W-26, sign-in popup,
# Live Fleet map, a trip route preview), switch to enforcing: comment the Report-Only line and
# uncomment the next one, then `nginx -t && systemctl reload nginx`.
add_header Content-Security-Policy-Report-Only $eld_csp always;
# add_header Content-Security-Policy $eld_csp always;

# ── Other security headers ────────────────────────────────────────────────────────────────────
# Hides the nginx version (`Server: nginx/1.24.0 (Ubuntu)` → `Server: nginx`). Valid in the
# server block this file is included in; putting it in the `http {}` block of nginx.conf covers
# every site on the host.
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Legacy twin of frame-ancestors 'none' for browsers without CSP level 2.
add_header X-Frame-Options "DENY" always;
# Firebase signInWithPopup needs window.opener between the app and the Google popup.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# microphone=(self): W-16 voice messages record with MediaRecorder; `()` silently broke recording.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), usb=(), fullscreen=(self), clipboard-write=(self)" always;
# One year. includeSubDomains covers only *.eldadmin.stackyard.uz (HSTS applies to the host that
# sends it and its subdomains — never to siblings like eldapi.stackyard.uz or the stackyard.uz apex).
# No `preload`: preloading is a separate, hard-to-undo opt-in.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
